<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photos</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="viewer">
  <img id="photo" src="photos/1.jpg">
</div>

<script>
const images = [];
for (let i = 1; i <= 24; i++) {
  images.push(`photos/${i}.jpg`);
}

let index = 0;
const photo = document.getElementById("photo");

/* groups */
const scale12 = [1,4,7,10,16,19,20,21];

/* scale */
function getScale(i){
  if(i === 0) return 1;
  if(scale12.includes(i)) return 1.2;
  return 1.4;
}

/* drift */
function getDrift(i){
  if(i === 0) return 0;
  if(scale12.includes(i)) return 20;
  return 50;
}

let scale = getScale(index);

let x = 0;
let y = 0;

let imgWidth = 0;
let imgHeight = 0;

function show(i){
  index = (i + images.length) % images.length;

  photo.onload = () => {
    scale = getScale(index);

    imgWidth = photo.naturalWidth * scale;
    imgHeight = photo.naturalHeight * scale;

    resetPosition();
  };

  photo.src = images[index];
}

/* clamp movement so no black edges */
function clampPosition(){

  if(index === 0){
    x = 0;
    y = 0;
    return;
  }

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const maxX = Math.max(0, (imgWidth - vw) / 2);
  const maxY = Math.max(0, (imgHeight - vh) / 2);

  x = Math.min(maxX, Math.max(-maxX, x));
  y = Math.min(maxY, Math.max(-maxY, y));
}

/* render */
function update(){

  if(index === 0){

    photo.style.transform = "none";
    photo.style.maxWidth = "100%";
    photo.style.maxHeight = "100%";
    photo.style.objectFit = "contain";

  } else {

    clampPosition();

    photo.style.maxWidth = "none";
    photo.style.maxHeight = "none";

    photo.style.transform =
      `translate(${x}px, ${y}px) scale(${scale})`;
  }
}

function resetPosition(){
  x = 0;
  y = 0;
  update();
}

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowRight") show(index + 1);
  if(e.key === "ArrowLeft") show(index - 1);
});

/* single tap / click next image */
photo.addEventListener("click", ()=>{

  /* allow normal behaviour on first image */
  if(index === 0){
    show(index + 1);
    return;
  }

  /* don't trigger next image after drag */
  if(moved){
    moved = false;
    return;
  }

  show(index + 1);
});

/* mouse drag */
let dragging = false;
let moved = false;

let startX, startY;

document.addEventListener("mousedown", e=>{

  if(index === 0) return;

  dragging = true;
  moved = false;

  startX = e.clientX - x;
  startY = e.clientY - y;
});

document.addEventListener("mousemove", e=>{

  if(!dragging) return;

  moved = true;

  x = e.clientX - startX;
  y = e.clientY - startY;

  update();
});

document.addEventListener("mouseup", ()=>{
  dragging = false;
});

/* touch */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", e=>{

  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;

  if(index === 0) return;

  startX = touchStartX - x;
  startY = touchStartY - y;
});

document.addEventListener("touchmove", e=>{

  if(index === 0) return;

  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;

  const dx = currentX - touchStartX;
  const dy = currentY - touchStartY;

  /* swipe image change */
  if(Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)){

    if(dx < 0){
      show(index + 1);
    } else {
      show(index - 1);
    }

    touchStartX = currentX;
    touchStartY = currentY;

    return;
  }

  /* pan */
  x = currentX - startX;
  y = currentY - startY;

  update();

}, { passive:true });

/* drift */
function drift(){

  const intensity = getDrift(index);

  if(intensity === 0) return;

  x += (Math.random() - 0.5) * intensity;
  y += (Math.random() - 0.5) * intensity;

  update();
}

setInterval(drift, 2000);

/* init */
show(0);

window.addEventListener("resize", update);

</script>

</body>
</html>
