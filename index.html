<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>photos</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
    overscroll-behavior: none;
}
#viewer {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
}
img {
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    touch-action: none;
    cursor: grab;
    will-change: transform;
    transform-origin: center center;
    -webkit-tap-highlight-color: transparent;
}
img:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="viewer">
    <img id="photo" src="photos/1.jpg" alt="" draggable="false">
</div>
<script>
const TOTAL = 33;
const images = [];
for (let i = 1; i <= TOTAL; i++) images.push(`photos/${i}.jpg`);

let index = 0;
const photo = document.getElementById("photo");
const viewer = document.getElementById("viewer");

const scale12 = [1,4,7,10,16,19,20,21];
function getScale(i) {
    if (i === 0) return 1;
    if (scale12.includes(i)) return 1.2;
    return 1.4;
}

let baseScale = 1;
let scale = 1;
let x = 0, y = 0;
let vx = 0, vy = 0;

let dragging = false;
let pinching = false;
let snapping = false;
let snapId = 0;
let imgLocked = false;

function clamp() {
    if (index === 0 || imgLocked) return;
    const nw = photo.naturalWidth || 1;
    const nh = photo.naturalHeight || 1;
    const dw = nw * scale;
    const dh = nh * scale;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const maxX = Math.max(0, (dw - vw) / 2);
    const maxY = Math.max(0, (dh - vh) / 2);
    if (x > maxX) x = maxX; else if (x < -maxX) x = -maxX;
    if (y > maxY) y = maxY; else if (y < -maxY) y = -maxY;
}

function update() {
    if (index === 0) {
        photo.style.transform = "none";
        photo.style.maxWidth = "100%";
        photo.style.maxHeight = "100%";
        photo.style.objectFit = "contain";
        return;
    }
    photo.style.maxWidth = "none";
    photo.style.maxHeight = "none";
    photo.style.transform = `translate3d(${x}px,${y}px,0) scale(${scale})`;
}

let loadToken = 0;
function show(i) {
    const nextIdx = (i + images.length) % images.length;
    const token = ++loadToken;
    const url = images[nextIdx];
    const pre = new Image();
    pre.onload = () => {
        if (token !== loadToken) return;
        index = nextIdx;
        dragging = false; pinching = false; pointers.clear();
        snapId++; snapping = false; imgLocked = false;
        photo.src = url;
        baseScale = getScale(index);
        scale = baseScale;
        x = 0; y = 0; vx = 0; vy = 0;
        if (index !== 0) {
            const horizontal = Math.random() > 0.25;
            if (horizontal) {
                vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
                vy = (Math.random() - 0.5) * 1.5;
            } else {
                vx = (Math.random() - 0.5) * 2;
                vy = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
            }
        }
        update();
        const after = images[(index + 1) % images.length];
        const p2 = new Image(); p2.src = after;
    };
    pre.onerror = () => {};
    pre.src = url;
}
function next() { show(index + 1); }

function animate() {
    if (!dragging && !pinching && !snapping && index !== 0 && !imgLocked) {
        x += vx; y += vy;
        vx *= 0.92; vy *= 0.92;
        if (Math.abs(vx) < 0.01) vx = 0;
        if (Math.abs(vy) < 0.01) vy = 0;
        clamp();
        update();
    }
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function snapBack() {
    if (index === 0) return;
    const id = ++snapId;
    const s0 = scale, x0 = x, y0 = y;
    if (Math.abs(s0 - baseScale) < 0.0005) {
        scale = baseScale; x = x0; y = y0; clamp(); update(); snapping = false; return;
    }
    snapping = true; imgLocked = false;
    const nw = photo.naturalWidth || 1, nh = photo.naturalHeight || 1;
    const vw = window.innerWidth, vh = window.innerHeight;
    const maxXb = Math.max(0, (nw * baseScale - vw) / 2);
    const maxYb = Math.max(0, (nh * baseScale - vh) / 2);
    const x1 = Math.min(maxXb, Math.max(-maxXb, x0));
    const y1 = Math.min(maxYb, Math.max(-maxYb, y0));
    const t0 = performance.now(), dur = 160;
    (function step(t) {
        if (id !== snapId) return;
        let k = (t - t0) / dur;
        if (k >= 1) k = 1;
        const e = 1 - Math.pow(1 - k, 3);
        scale = s0 + (baseScale - s0) * e;
        x = x0 + (x1 - x0) * e;
        y = y0 + (y1 - y0) * e;
        clamp(); update();
        if (k < 1) requestAnimationFrame(step);
        else { snapping = false; scale = baseScale; x = x1; y = y1; clamp(); update(); }
    })(t0);
}

const pointers = new Map();
let downX = 0, downY = 0, lastX = 0, lastY = 0, downTime = 0, moved = 0;
let tapCandidate = false;
let pinchD0 = 0, pinchS0 = 1, pinchMidX0 = 0, pinchMidY0 = 0, pinchX0 = 0, pinchY0 = 0;

function dist2(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

photo.addEventListener("pointerdown", e => {
    try { photo.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    snapId++; snapping = false;
    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinching = true; dragging = false; tapCandidate = false; imgLocked = true;
        pinchD0 = Math.max(1, dist2(a, b));
        pinchS0 = scale;
        pinchMidX0 = (a.x + b.x) / 2; pinchMidY0 = (a.y + b.y) / 2;
        pinchX0 = x; pinchY0 = y;
        vx = 0; vy = 0;
        return;
    }
    if (pointers.size === 1) {
        downX = lastX = e.clientX; downY = lastY = e.clientY;
        downTime = performance.now(); moved = 0;
        tapCandidate = true;
        if (index !== 0) { dragging = true; imgLocked = false; vx = 0; vy = 0; }
    }
}, { passive: true });

photo.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinching && pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.max(1, dist2(a, b));
        let s = pinchS0 * (d / pinchD0);
        const lo = baseScale * 0.55, hi = baseScale * 2.8;
        if (s < lo) s = lo; else if (s > hi) s = hi;
        scale = s;
        const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
        x = pinchX0 + (midX - pinchMidX0);
        y = pinchY0 + (midY - pinchMidY0);
        moved = 100000;
        clamp(); update();
        return;
    }
    if (dragging && pointers.size === 1) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        moved += Math.abs(dx) + Math.abs(dy);
        if (moved > 8) tapCandidate = false;
        x += dx; y += dy;
        vx = vx * 0.7 + dx * 0.25;
        vy = vy * 0.7 + dy * 0.25;
        if (vx > 20) vx = 20; else if (vx < -20) vx = -20;
        if (vy > 20) vy = 20; else if (vy < -20) vy = -20;
        clamp(); update();
    }
}, { passive: true });

function endPointer(e) {
    const wasPinch = pinching;
    pointers.delete(e.pointerId);
    if (wasPinch) {
        if (pointers.size >= 2) return;
        pinching = false;
        if (pointers.size === 1) {
            const [p] = [...pointers.values()];
            lastX = p.x; lastY = p.y;
            if (index !== 0) { dragging = true; imgLocked = false; }
            tapCandidate = false;
            return;
        }
        snapBack();
        return;
    }
    if (pointers.size !== 0) return;
    dragging = false;
    const dt = performance.now() - downTime;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (tapCandidate && moved < 8 && dt < 300) { next(); return; }
    if (dx < -70 && dt < 500 && Math.abs(dx) > 1.8 * Math.abs(dy) && vx < -0.2) { next(); return; }
    if (Math.abs(vx) > 20) vx = Math.sign(vx) * 20;
    if (Math.abs(vy) > 20) vy = Math.sign(vy) * 20;
}
photo.addEventListener("pointerup", endPointer, { passive: true });
photo.addEventListener("pointercancel", endPointer, { passive: true });

document.addEventListener("keydown", e => {
    if (["ArrowRight"," ","Enter"].includes(e.key)) next();
    else if (e.key === "ArrowLeft") next();
});
photo.addEventListener("dragstart", e => e.preventDefault());
photo.addEventListener("dblclick", e => e.preventDefault());
document.addEventListener("contextmenu", e => { if (e.target === photo) e.preventDefault(); });
window.addEventListener("resize", () => { clamp(); update(); });

show(0);
</script>
</body>
</html>
