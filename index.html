<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photos</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  height: 100%;
}

#viewer {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

img {
  user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
  will-change: transform;
}
</style>
</head>

<body>

<div id="viewer">
  <img id="photo" src="photos/1.jpg">
</div>

<script>
const images = [];
for (let i = 1; i <= 24; i++) {
  images.push(`photos/${i}.jpg`);
}

let index = 0;
const photo = document.getElementById("photo");

/* scale groups */
const scale12 = [1,4,7,10,16,19,20,21];

function getBaseScale(i){
  if(i === 0) return 1;
  if(scale12.includes(i)) return 1.2;
  return 1.4;
}

/* state */
let x = 0, y = 0;
let vx = 0, vy = 0;

let scale = 1;
let targetScale = 1;

/* image load */
function show(i){
  index = (i + images.length) % images.length;

  photo.onload = () => {
    targetScale = getBaseScale(index);
    scale = targetScale;

    x = 0;
    y = 0;
    vx = 0;
    vy = 0;

    update();
  };

  photo.src = images[index];
}

/* render */
function update(){
  if(index === 0){
    photo.style.transform = "none";
    photo.style.maxWidth = "100%";
    photo.style.maxHeight = "100%";
    photo.style.objectFit = "contain";
    return;
  }

  photo.style.maxWidth = "none";
  photo.style.maxHeight = "none";

  photo.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

/* animation loop */
function animate(){
  /* inertia */
  x += vx;
  y += vy;

  vx *= 0.92;
  vy *= 0.92;

  if(Math.abs(vx) < 0.01) vx = 0;
  if(Math.abs(vy) < 0.01) vy = 0;

  /* spring back scale */
  scale += (targetScale - scale) * 0.08;

  update();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowRight") show(index + 1);
  if(e.key === "ArrowLeft") show(index - 1);
});

/* click next */
photo.addEventListener("click", ()=>{
  show(index + 1);
});

/* mouse drag */
let dragging = false;
let startX = 0, startY = 0;

document.addEventListener("mousedown", e=>{
  if(index === 0) return;

  dragging = true;
  startX = e.clientX - x;
  startY = e.clientY - y;

  vx = 0;
  vy = 0;
});

document.addEventListener("mousemove", e=>{
  if(!dragging) return;

  const nx = e.clientX - startX;
  const ny = e.clientY - startY;

  vx = nx - x;
  vy = ny - y;

  x = nx;
  y = ny;
});

document.addEventListener("mouseup", ()=>{
  dragging = false;
});

/* touch drag + pinch */
let tStartX = 0, tStartY = 0;
let lastTX = 0, lastTY = 0;

let pinchStart = null;

function pinchDist(t){
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

document.addEventListener("touchstart", e=>{
  if(index === 0) return;

  if(e.touches.length === 2){
    pinchStart = pinchDist(e.touches);
    return;
  }

  tStartX = e.touches[0].clientX - x;
  tStartY = e.touches[0].clientY - y;

  lastTX = e.touches[0].clientX;
  lastTY = e.touches[0].clientY;
});

document.addEventListener("touchmove", e=>{
  if(index === 0) return;

  /* pinch zoom */
  if(e.touches.length === 2 && pinchStart){
    const newDist = pinchDist(e.touches);
    const zoom = newDist / pinchStart;

    targetScale = getBaseScale(index) * Math.max(0.6, Math.min(1.6, zoom));
    return;
  }

  /* pan */
  const tx = e.touches[0].clientX;
  const ty = e.touches[0].clientY;

  x = tx - tStartX;
  y = ty - tStartY;

  vx = tx - lastTX;
  vy = ty - lastTY;

  lastTX = tx;
  lastTY = ty;

}, { passive:true });

document.addEventListener("touchend", ()=>{
  pinchStart = null;
  targetScale = getBaseScale(index);
});

/* start */
show(0);
</script>

</body>
</html>
